<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - T.S.P. corp</title>
</head>
<body class="centralized">
    <form>
        <img src="imagens/logo.png" alt="logo T.S.P.corp">
        <div>
            <h1>T.S.P.corp</h1>
        </div>
        <div class="form-field">
            <div><label>email</label></div>
            <input type="email" name="email" id="email" placeholder="seuemail@gmail.com" onchange="onChangeEmail()">
            <div class="error" id="email-invalid-error">Email é invalido</div>
            <div class="error" id="email-required-error">Email é obrigatorio</div>
        </div>
        <div class="form-field">
            <div><label>senha</label></div>
            <input type="password" name="password" id="password" placeholder="senha" onchange="onChangePassword()">
            <div class="error" id="password-min-lengh-error">a senha precisar ter no minimo 6 caracteres</div>
            <div class="error" id="password-required-error">senha é obrigatoria</div>
        </div>
        <div class="form-field">
            <div><label>confirmar senha</label></div>
            <input type="password" name="password" id="confirm-password" placeholder="confirmar senha" onchange="onChangeConfirmPassword()">
            <div class="error" id="password-doesnt-match-error">as senhas não coincidem</div>
        </div>
        <div>
            <button type="button" class="solid" id="register-button" disabled = true onclick="register()">
                Registrar
            </button>
            <button type="button" class="clear" onclick="login()">
                login
            </button>
        </div>
        <div>
            <button type="button" class="outline" id="toggle-Password-Button" onclick="togglePassword(this)">
                Mostrar senha
            </button>
        </div>
    </form>
</body>
<link rel="stylesheet" href="style/global.css">
<link rel="stylesheet" href="style/regisrter.css">

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="firebase-init.js"></script>

<script src="script/register.js"></script>
<script src="script/validations.js"></script>
<script src="script/loading.js"></script>



</html>
