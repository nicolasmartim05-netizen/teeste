<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - T.S.P.corp</title>
    
</head>
<body class="centralized">

   <form>
    <img src="imagens/logo (2).png" alt="logo T.S.P.corp">
    <div>
    <h1>T.S.P.corp</h1>
    </div>
        <div class="form-field">
            <label>Email</label> 
            <br>
            <input type="email" name="email" id="email" onchange="onChangeEmail()" placeholder="seuemail@gmail.com">
            <div class="error" id="email-invalid-error">Email é invalido</div>
            <div class="error" id="email-required-error">Email é obrigatorio</div>
        </div>
        <div class="form-field">
            <label>Senha</label> 
            <br>
            <input type="password" name="password" id="password" onchange="onChangePassword()" placeholder="senha">
            <div class="error" id="password-required-error">Senha é obrigatoria</div>
        </div>
        <div>
            <button type="button" class="clear" id="revocer-password-button" disabled="true" onclick="recoverPassword()">Recuperar senha</button>
        </div>
        <div>
            <button type="button" class="solid" id="login-button" disabled="true" onclick="login()">Entrar</button>
        </div>
        <div>
            <button type="button" class="outline" onclick="register()">Registrar</button>
        </div>
        <div>
            <button type="button" class="outline" id="toggle-Password-Button" onclick="togglePassword(this)">
                Mostrar senha
            </button>
        </div>

   </form>
</body>
<script src="script/index.js"></script>
<script src="script/validations.js"></script>
<script src="script/loading.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="firebase-init.js"></script>

<link rel="stylesheet" href="style/index.css">
<link rel="stylesheet" href="style/global.css">
</html>
